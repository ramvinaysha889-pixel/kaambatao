<!DOCTYPE html>
<html lang="hi-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B14" />
  <title>Tavunera — One AI for Everything</title>
  <meta name="description" content="Tavunera: chat, photo aur document samjho, research karo, aur bahut kuch — ek hi jagah." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ============ HEADER ============ -->
    <header class="app-header">
      <div class="brand" id="brandHome">
        <span class="brand-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="7" fill="url(#g1)"/>
            <path d="M6 12C6 8.7 8.7 6 12 6C15.3 6 18 8.7 18 12C18 15.3 15.3 18 12 18" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="2.2" fill="white"/>
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop stop-color="#8B5CF6"/>
                <stop offset="1" stop-color="#F59E0B"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand-name">Tavunera</span>
      </div>

      <div class="header-actions hidden" id="chatHeaderActions">
        <button class="icon-btn" id="clearChatBtn" type="button" title="Clear conversation" aria-label="Clear conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 7H18M9 7V5C9 4.45 9.45 4 10 4H14C14.55 4 15 4.45 15 5V7M17 7L16.3 18.4C16.26 19.02 15.75 19.5 15.13 19.5H8.87C8.25 19.5 7.74 19.02 7.7 18.4L7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-outline btn-sm" id="newChatBtn" type="button">+ New Chat</button>
      </div>
    </header>

    <!-- ============ MAIN SCROLL AREA ============ -->
    <main class="main-scroll" id="mainScroll">

      <!-- ---------- HOME VIEW ---------- -->
      <section class="view active" id="view-home">
        <div class="hero">
          <h1 class="hero-title">What can I help you with?</h1>
          <p class="hero-sub">Photo bhejo, document samjho, ya kuch bhi poocho — Tavunera madad karega.</p>
        </div>

        <div class="quick-actions" id="quickActions">
          <button class="quick-card" type="button" data-mode="search">
            <span class="quick-emoji">🔎</span>
            <span class="quick-label">Deep Search</span>
          </button>
          <button class="quick-card" type="button" data-mode="image-gen">
            <span class="quick-emoji">🖼️</span>
            <span class="quick-label">Create Image</span>
          </button>
          <button class="quick-card" type="button" data-mode="pdf">
            <span class="quick-emoji">📄</span>
            <span class="quick-label">PDF</span>
          </button>
          <button class="quick-card" type="button" data-mode="code">
            <span class="quick-emoji">💻</span>
            <span class="quick-label">Code</span>
          </button>
          <button class="quick-card" type="button" data-mode="file-analysis">
            <span class="quick-emoji">📊</span>
            <span class="quick-label">Analyze File</span>
          </button>
        </div>

        <p class="privacy-note">🔒 Aapki photo/file sirf analysis ke liye use hoti hai.</p>
      </section>

      <!-- ---------- CHAT VIEW ---------- -->
      <section class="view" id="view-chat">
        <div class="chat-list" id="chatList"></div>
      </section>

    </main>

    <!-- ============ COMPOSER (always docked at bottom) ============ -->
    <div class="composer-wrap">
      <div class="attachment-chip hidden" id="attachmentChip">
        <img id="attachmentThumb" class="attachment-thumb" alt="Attached file preview" />
        <span class="attachment-name" id="attachmentName"></span>
        <button class="attachment-remove" id="attachmentRemove" type="button" aria-label="Remove attachment">✕</button>
      </div>

      <div class="mode-chip hidden" id="modeChip">
        <span id="modeChipLabel"></span>
        <button class="attachment-remove" id="modeChipRemove" type="button" aria-label="Clear mode">✕</button>
      </div>

      <div class="composer">
        <div class="composer-tools">
          <button class="tool-btn" id="attachFileBtn" type="button" title="Attach file" aria-label="Attach file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M8 12L14.5 5.5C15.9 4.1 18.1 4.1 19.5 5.5C20.9 6.9 20.9 9.1 19.5 10.5L11.5 18.5C9.6 20.4 6.4 20.4 4.5 18.5C2.6 16.6 2.6 13.4 4.5 11.5L12 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tool-btn" id="attachPhotoBtn" type="button" title="Upload photo" aria-label="Upload photo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="14" rx="2.3" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10.5" r="1.6" stroke="currentColor" stroke-width="1.5"/><path d="M4 16.5L8.5 13L12 15.5L16 11.5L20 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tool-btn" id="attachCameraBtn" type="button" title="Camera" aria-label="Camera">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 16.5V7.5C4 6.67 4.67 6 5.5 6H8L9.2 4.3C9.4 4.02 9.72 3.85 10.06 3.85H13.94C14.28 3.85 14.6 4.02 14.8 4.3L16 6H18.5C19.33 6 20 6.67 20 7.5V16.5C20 17.33 19.33 18 18.5 18H5.5C4.67 18 4 17.33 4 16.5Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
        </div>

        <textarea
          id="composerInput"
          class="composer-input"
          placeholder="Kuch bhi poochein... ya photo bhejein"
          rows="1"
        ></textarea>

        <button class="send-btn" id="sendBtn" type="button" aria-label="Send" disabled>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4.5 12L19.5 4.5L15 12L19.5 19.5L4.5 12Z" fill="white"/></svg>
        </button>
      </div>

      <input type="file" id="fileInputGeneric" class="visually-hidden" />
      <input type="file" id="fileInputPhoto" accept="image/*" class="visually-hidden" />
      <input type="file" id="fileInputCamera" accept="image/*" capture="environment" class="visually-hidden" />
    </div>

  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
